<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>像素账本 v8.5 · PIXEL LEDGER</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23eef4ff'/><rect x='3' y='5' width='10' height='7' fill='%23ffc107'/><rect x='3' y='3' width='10' height='2' fill='%2316161f'/></svg>">
<meta name="theme-color" content="#eef1f9">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Press+Start+2P&display=swap">
<style>
:root{
  --ink:#16161f;--ink-soft:#3b3b52;--muted:#8a8aa3;
  --line:rgba(22,22,31,.10);--line2:rgba(22,22,31,.18);
  --shadow-soft:rgba(96,106,150,.09);
  --gold:#ffc107;--gold-d:#8f6900;--gold-soft:rgba(255,203,71,.18);
  --green:#12b886;--red:#ff5c52;--sky:#2f7cf6;--plum:#9b5cff;
  --font-cn:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --font-px:"Press Start 2P",var(--font-cn);
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100dvh;background-color:#eef1f9;
  background-image:
    radial-gradient(1100px 620px at 50% -14%, rgba(255,196,64,.30), rgba(255,196,64,0) 62%),
    radial-gradient(820px 620px at 108% 0%, rgba(155,92,255,.20), rgba(155,92,255,0) 58%),
    radial-gradient(780px 660px at -10% 100%, rgba(47,124,246,.18), rgba(47,124,246,0) 58%),
    radial-gradient(circle at 1px 1px, rgba(22,22,31,.08) 1px, transparent 1.4px),
    linear-gradient(180deg,#f4f8ff 0%, #eef1f9 46%, #fbf3e7 100%);
  background-size:auto,auto,auto,16px 16px,auto;background-attachment:fixed;
  color:var(--ink);font-family:var(--font-cn);font-size:16px;line-height:1.5;
}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(22,22,31,.16);border-radius:4px}

#loginView{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{width:100%;max-width:380px;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.90));border:1px solid rgba(224,168,0,.45);border-radius:12px;padding:24px 20px;box-shadow:0 0 0 1px rgba(255,255,255,.9), 8px 8px 0 rgba(110,120,170,.10), 0 30px 70px rgba(60,70,120,.20)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-logo .mark{width:52px;height:52px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,#fff6d6,#ffefb8);border:1px solid rgba(224,168,0,.5);border-radius:6px}
.login-logo .t1{font-size:19px;font-weight:800;letter-spacing:.06em;line-height:1.15}
.login-logo .t2{font-family:var(--font-px);font-size:7px;color:var(--gold-d);letter-spacing:.1em;margin-top:5px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>label{font-size:11px;color:var(--muted);letter-spacing:.1em}
.inp{width:100%;min-height:44px;padding:8px 10px;background:rgba(255,255,255,.92);border:1px solid rgba(22,22,31,.12);color:var(--ink);font-size:16px;outline:none;border-radius:6px}
.inp:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(47,124,246,.16)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.inp{min-height:80px;resize:vertical;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border:1px solid #d9a400;background:linear-gradient(180deg,#ffd24a,#ffc107);color:#2b2000;font-size:15px;font-weight:800;border-radius:7px;cursor:pointer;box-shadow:2px 2px 0 rgba(201,154,0,.20)}
.btn:active:not([disabled]){transform:translate(1px,1px)}
.btn.block{width:100%}
.btn.ghost{background:rgba(255,255,255,.82);color:var(--ink);border-color:var(--line2);box-shadow:2px 2px 0 var(--shadow-soft)}
.btn.danger{background:#fff2f1;color:#c92a2a;border-color:#f3b7b2}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.login-hint{font-size:12px;color:var(--muted);line-height:1.8;text-align:center;margin-top:14px}
.login-hint b{color:var(--gold-d)}
.err-box{font-size:12px;color:#c92a2a;background:#ffeceb;border:1px solid #ffc9c5;padding:8px 10px;border-radius:6px;margin-bottom:12px}

.inp-wrap{position:relative;display:flex;align-items:center}
.inp-wrap .inp{padding-right:42px}
.inp-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;background:transparent;border:0;cursor:pointer;color:var(--muted);font-size:16px;padding:0;border-radius:5px}
.inp-eye.on{color:var(--gold-d)}

.app{min-height:100dvh;display:flex;max-width:1400px;margin:0 auto;position:relative}
.side{display:none;flex:none;width:200px;padding:16px 10px;flex-direction:column;gap:2px;background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.42));border-right:1px solid var(--line);position:sticky;top:0;height:100dvh;overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:9px;padding:4px 6px 14px}
.side-brand .mark{width:34px;height:34px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,#fff6d6,#ffefb8);border:1px solid rgba(224,168,0,.5);border-radius:5px}
.side-brand b{font-size:15px;letter-spacing:.05em;line-height:1.2}
.side-brand span{display:block;font-family:var(--font-px);font-size:6px;color:var(--gold-d);letter-spacing:.12em;margin-top:3px}
.side-group{font-size:10px;color:var(--muted);letter-spacing:.12em;padding:12px 10px 4px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:10px;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink-soft);font-size:13.5px;font-weight:700;cursor:pointer;border-radius:0 6px 6px 0;text-align:left}
.nav-item .ico{font-size:15px;flex:none;width:20px;text-align:center;line-height:1}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{font-family:var(--font-px);font-size:7px;color:var(--muted);flex:none}
.nav-item.on{background:rgba(255,255,255,.92);border-left-color:var(--gold);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.9) inset}
.side-foot{margin-top:auto;padding:12px 6px 0;font-size:10px;color:var(--muted);line-height:1.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh}

/* ====== 顶栏 ====== */
.topbar{
  position:relative;flex:none;height:72px;
  background:rgba(255,255,255,.84);
  background-image: radial-gradient(circle at 1px 1px, rgba(22,22,31,.035) 1px, transparent 1.4px);
  background-size: 8px 8px;
  border-bottom: 3px solid rgba(255,193,7,.55);
  display:flex;align-items:center;
  box-shadow: 0 2px 0 rgba(0,0,0,.025);
  z-index:20;
}
.topbar-content{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:0 14px;
}
.page-title{
  display:flex;flex-direction:column;gap:2px;
  font-size:18px;font-weight:800;letter-spacing:.06em;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink);
  text-shadow: 1px 1px 0 #fff;
}
.page-title small{
  display:block;font-family:var(--font-px);font-size:7px;color:var(--gold-d);
  letter-spacing:.1em;margin-top:4px;
  text-shadow: 1px 1px 0 #fff;
}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.pixel-btn{
  display:flex;align-items:center;gap:5px;
  background:#fff;color:var(--gold-d);
  border:2px solid #ffc107;border-radius:0;
  padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;
  box-shadow: 2px 2px 0 rgba(201,154,0,.2);
  transition:transform .1s;
}
.pixel-btn:active{transform:translate(2px,2px);box-shadow:none;}
.pixel-btn.danger{border-color:#f3b7b2;color:#c92a2a;box-shadow: 2px 2px 0 rgba(201,42,42,.1);}
.sync-status{
  display:flex;align-items:center;gap:5px;
  font-size:12px;color:var(--ink);font-weight:700;
  background:rgba(255,255,255,.7);padding:4px 8px;border:1px solid rgba(22,22,31,.1);
  border-radius:4px;
}
.sync-dot{
  width:8px;height:8px;background:#c8ccda;flex:none;
}
.sync-dot.ok{background:#38b764;}
.sync-dot.busy{background:#ffc107;animation:blink .8s steps(2) infinite;}
.sync-dot.err{background:#b13e53;}
@keyframes blink{50%{opacity:.25}}

#carSelectorWrap { display:none; align-items:center; margin-left:2px; }
#carSelectorWrap.on { display:flex; }
.car-select-btn {
  background:#fff; border:2px solid #ffc107; border-radius:0;
  padding:4px 8px; font-size:12px; font-weight:700; color:var(--gold-d);
  cursor:pointer; box-shadow:2px 2px 0 rgba(201,154,0,.2);
}
.car-select-btn:active{transform:translate(2px,2px);box-shadow:none;}

.pages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:88px}
@media(min-width:900px){.pages{padding-bottom:24px}}
.page{padding:14px;max-width:1100px;margin:0 auto;width:100%}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;overflow-x:auto;scrollbar-width:none;background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.94));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{flex:0 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 7px;background:transparent;border:0;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer}
.tabbar button .ico{font-size:17px;line-height:1}
.tabbar button.on{color:var(--gold-d)}
@media(min-width:900px){.side{display:flex}.tabbar{display:none}}

.card{background:linear-gradient(180deg,#ffffff,#fdfdff);border:1px solid rgba(22,22,31,.08);border-radius:9px;box-shadow:2px 2px 0 var(--shadow-soft);padding:13px;margin-bottom:12px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-title{font-size:13px;font-weight:800;letter-spacing:.06em}
.card-sub{font-family:var(--font-px);font-size:6.5px;color:var(--muted);letter-spacing:.1em}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(min-width:640px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
.kpi{background:linear-gradient(180deg,#ffffff,#fbfcff);border:1px solid rgba(22,22,31,.08);border-radius:9px;padding:11px 12px;box-shadow:2px 2px 0 var(--shadow-soft);border-top:3px solid var(--accent,#ffc107)}
.kpi .k-label{font-family:var(--font-px);font-size:6.5px;color:var(--muted);letter-spacing:.1em;margin-bottom:7px}
.kpi .k-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .k-val.green{color:#0b7a52}
.kpi .k-val.red{color:#c92a2a}
.kpi .k-sub{font-size:11px;color:var(--muted);margin-top:4px}
.chip{flex:none;height:32px;padding:0 12px;background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:16px;color:var(--ink-soft);font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-d)}
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;flex-wrap:wrap}
.filter-bar::-webkit-scrollbar{display:none}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip-label{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-right:2px}
.chart-box{background:rgba(255,255,255,.58);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:2px 2px 0 var(--shadow-soft);margin-bottom:12px}
.chart-box canvas{display:block;width:100%}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px 12px;padding:8px 4px 2px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft)}
.legend-dot{width:10px;height:10px;flex:none;border-radius:2px;border:1px solid rgba(0,0,0,.12)}
.legend-val{font-family:var(--font-px);font-size:7px;color:var(--muted);margin-left:2px}
.hbar-row{display:grid;grid-template-columns:72px 1fr 78px;align-items:center;gap:8px;padding:5px 0}
.hbar-label{font-size:12px;font-weight:700;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{height:14px;background:rgba(22,22,31,.05);border-radius:2px;overflow:hidden}
.hbar-fill{height:100%;border-radius:2px;min-width:3px}
.hbar-val{font-size:12px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.txn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;margin-bottom:7px;background:linear-gradient(180deg,#ffffff,#fdfdff);border:1px solid rgba(22,22,31,.08);border-left:3px solid var(--accent,#ffc107);border-radius:7px;box-shadow:2px 2px 0 var(--shadow-soft);cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.txn:active{transform:translate(1px,1px)}
.txn.refund{border-left-style:dashed;background:linear-gradient(180deg,#f8fff9,#f0fff5)}
.txn-icon{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:6px;font-size:14px;font-weight:800;color:#fff}
.txn-body{flex:1;min-width:0}
.txn-name{font-size:14px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn-meta{font-size:11px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn-amt{flex:none;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.txn-amt.income{color:#0b7a52}
.txn-amt.expense{color:#c92a2a}
.txn-amt.refund{color:#0b7a52}
.txn-tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.mini-tag{font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(22,22,31,.05);color:var(--ink-soft);border:1px solid rgba(22,22,31,.08)}
.refund-tag{font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(18,184,134,.12);color:#0b7a52;border:1px solid rgba(18,184,134,.3)}
.empty{padding:26px 16px;text-align:center;border:2px dashed var(--line2);color:var(--muted);font-size:14px;line-height:1.9;background:rgba(255,255,255,.52);border-radius:9px}
.empty b{display:block;font-family:var(--font-px);font-size:10px;color:var(--line2);margin-bottom:8px}
.tip{font-size:11px;color:var(--muted);line-height:1.7}
.tip b{color:var(--gold-d)}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:28;width:54px;height:54px;border-radius:50%;border:1px solid #d9a400;background:linear-gradient(180deg,#ffd24a,#ffc107);color:#2b2000;font-size:26px;font-weight:800;display:grid;place-items:center;cursor:pointer;box-shadow:3px 3px 0 rgba(201,154,0,.22)}
@media(min-width:900px){.fab{bottom:24px;right:24px}}
.layer{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(34,38,62,.34);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);overflow-y:auto}
.layer.on{display:flex}
.pxwin{position:relative;width:100%;max-width:480px;max-height:calc(100dvh - 28px);display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.94));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);overflow:hidden;border:1px solid rgba(224,168,0,.45);border-radius:12px;box-shadow:0 0 0 1px rgba(255,255,255,.9), 0 30px 70px rgba(60,70,120,.28);animation:pop .22s steps(4) both}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.win-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;padding:12px 12px 12px 14px;background:linear-gradient(180deg,rgba(255,251,238,.95),rgba(255,255,255,.7));border-bottom:1px solid rgba(224,168,0,.25)}
.win-title{font-family:var(--font-px);font-size:8px;color:var(--gold-d);letter-spacing:.14em}
.win-sub{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-top:3px}
.win-x{width:32px;height:32px;flex:none;display:grid;place-items:center;padding:0;background:rgba(255,255,255,.9);border:1px solid var(--line2);border-radius:6px;color:var(--ink);cursor:pointer}
.win-x svg{width:12px;height:12px}
.win-scroll{padding:12px;overflow-y:auto;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.win-foot{flex:none;padding:10px 12px 12px;border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.9));display:flex;flex-direction:column;gap:10px}
.win-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.pxwin.compact .win-scroll { gap: 6px; padding: 10px; }
.pxwin.compact .field { gap: 3px; }
.pxwin.compact .field > label { font-size: 10px; }
.pxwin.compact .inp { min-height: 38px; padding: 6px 9px; font-size: 15px; }
.pxwin.compact select.inp { background-position:calc(100% - 18px) 17px,calc(100% - 13px) 17px; }
.pxwin.compact .divider { margin: 6px 0; }
.pxwin.compact .win-actions { gap: 6px; }
.pxwin.compact .win-actions .btn { min-height: 40px; font-size: 14px; }
.pxwin.compact .win-foot { padding: 8px 10px 10px; gap: 5px; }
.pxwin.compact .win-foot .tip { font-size: 10px; }
.pxwin.compact .multi-chips { padding: 2px 0; }
.pxwin.compact .mchip { height: 28px; font-size: 12px; }

/* ====== 紧凑录入表单 ====== */
.tx-form{display:flex;flex-direction:column;gap:9px}
.tx-amount-row{display:flex;gap:8px;align-items:stretch}
.tx-amount-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.98);border:1px solid rgba(22,22,31,.14);border-radius:8px;padding:0 10px;min-height:54px}
.tx-amount-wrap .cur{font-size:20px;font-weight:800;color:var(--gold-d);flex:none}
.tx-amount-wrap input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);padding:0;font-family:inherit}
.tx-amount-wrap input::placeholder{color:rgba(22,22,31,.2)}
.tx-amount-wrap:focus-within{border-color:var(--sky);box-shadow:0 0 0 3px rgba(47,124,246,.14)}
.tx-date-wrap{width:136px;flex:none}
.tx-date-wrap .inp{min-height:54px;font-size:14px;padding:6px 8px}
.tx-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tx-field{display:flex;flex-direction:column;gap:3px;min-width:0}
.tx-field>label{font-size:10.5px;color:var(--muted);letter-spacing:.08em;font-weight:700}
.tx-field .inp{min-height:40px;padding:6px 9px;font-size:14px}
.tx-field select.inp{background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;padding-right:28px}
.tx-refund-row{display:flex;align-items:center;gap:8px}
.tx-car-box{border:1px dashed rgba(224,168,0,.55);background:rgba(255,248,230,.62);border-radius:8px;padding:9px;display:flex;flex-direction:column;gap:8px}
.tx-box-title{font-size:11px;font-weight:800;color:#8f6900;letter-spacing:.08em}
@media(max-width:400px){
  .tx-grid2{grid-template-columns:1fr}
  .tx-date-wrap{width:118px}
}

/* ====== 年度目标进度 ====== */
.goal-row{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;box-shadow:2px 2px 0 var(--shadow-soft)}
.goal-head{display:flex;align-items:center;gap:8px}
.goal-name{flex:1;min-width:0;font-size:13.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  function verifyPassword(input, auth) {
    if (!auth) return Promise.resolve(false);
    if (auth.hash && auth.salt) return pbkdf2Hash(input, auth.salt, auth.iters || PBKDF2_ITERS).then(function (c) { return c === auth.hash; });
    if (typeof auth.pass === 'string') return Promise.resolve(input === auth.pass);
    return Promise.resolve(false);
  }
  function migrateAuthToHash() {
    if (!db.auth || !db.auth.pass || db.auth.hash) return Promise.resolve(false);
    if (!hasCryptoSubtle()) return Promise.resolve(false);
    var salt = randomSaltHex();
    return pbkdf2Hash(db.auth.pass, salt, PBKDF2_ITERS).then(function (hash) {
      db.auth.salt = salt; db.auth.hash = hash; db.auth.iters = PBKDF2_ITERS;
      delete db.auth.pass; persist(); return true;
    }).catch(function () { return false; });
  }

  async function deriveEncryptionKey(password, saltHex) {
    if (!hasCryptoSubtle()) throw new Error('当前环境不支持加密，请通过 HTTPS 访问');
    var enc = new TextEncoder();
    var keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: hexToBytes(saltHex), iterations: PBKDF2_ITERS, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
  }

  async function encryptString(plainText, password) {
    var salt = randomSaltHex();
    var key = await deriveEncryptionKey(password, salt);
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(plainText));
    return JSON.stringify({
      v: 2,
      alg: 'AES-GCM-256',
      s: salt,
      i: bytesToHex(iv),
      d: b64Encode(new Uint8Array(ciphertext))
    });
  }

  async function decryptString(encryptedJson, password) {
    var obj = JSON.parse(encryptedJson);
    var salt = obj.s || obj.salt;
    var ivHex = obj.i || obj.iv;
    var dataB64 = obj.d || obj.data;
    if (!salt || !ivHex || !dataB64) throw new Error('无效的数据结构，可能已被篡改');

    var key = await deriveEncryptionKey(password, salt);
    var iv = hexToBytes(ivHex);
    var data = new Uint8Array(b64Decode(dataB64).split('').map(function(c){return c.charCodeAt(0);}));
    var plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
    return new TextDecoder().decode(plainBuf);
  }

  async function ghGet() {
    if (!GH.ready()) return null;
    var j = await ghGetRaw();
    if (!j || !j.content) return null;
    var rawStr = b64Decode(j.content);
    var parsed;
    try { parsed = JSON.parse(rawStr); } catch(e) { throw new Error('云端数据格式损坏'); }

    if (parsed.v === 2 || parsed.v === 1 || parsed.alg === 'AES-GCM-256') {
      var pwd = ENC.getPwd();
      if (!pwd) throw new Error('需要加密密码解锁云端数据');
      var plain = await decryptString(rawStr, pwd);
      var data = JSON.parse(plain);
      if (!data || !Array.isArray(data.txns)) throw new Error('解密后的数据结构异常，可能已被篡改');
      return data;
    } else {
      return parsed;
    }
  }

  async function ghPut(data) {
    if (!GH.ready()) return Promise.reject(new Error('未配置 GitHub 同步'));
    var contentToPush = '';
    if (ENC.isEnabled()) {
      var pwd = ENC.getPwd();
      if (!pwd) throw new Error('加密已开启，但缺少加密密码，请重新输入');
      contentToPush = await encryptString(JSON.stringify(data), pwd);
    } else {
      contentToPush = JSON.stringify(data);
    }
    
    var existing = await ghGetRaw();
    var body = { message: 'pixel-ledger sync ' + new Date().toISOString(), content: b64Encode(contentToPush), branch: GH.branch };
    if (existing && existing.sha) body.sha = existing.sha;
    var r = await fetch(ghUrl(), { method: 'PUT', headers: Object.assign({'Content-Type':'application/json'}, ghHeaders()), body: JSON.stringify(body) });
    if (!r.ok) {
      var e = await r.json();
      throw new Error('写入失败('+r.status+')：'+(e.message||'权限不足'));
    }
    return r.json();
  }

  function expenseStats(list) {

    for (var i = 0; i < list.length; i++) {

      if (t.type !== 'expense') continue;
      var v = Number(t.amount) || 0;

  function txnMatchesModule(t,m){
    if(!m||!m.rules)return false;
    var rules=m.rules;
    var types=(Array.isArray(rules.types)&&rules.types.length)?rules.types:['expense'];
    if(t.type==='transfer') return types.indexOf('transfer')!==-1;
    if(types.indexOf(t.type)===-1) return false;
    var cat=catById(t.catId);
    var catHit=!!(cat && cat.moduleId===m.id);
    if(rules.catIds && rules.catIds.length && t.catId && rules.catIds.indexOf(t.catId)!==-1) catHit=true;
    var platHit=false;
    if(rules.platformIds && rules.platformIds.length && t.platformId && rules.platformIds.indexOf(t.platformId)!==-1) platHit=true;
    var tagHit=false;
    if(rules.tags && rules.tags.length){
      for(var i=0;i<(t.tags||[]).length;i++){ if(rules.tags.indexOf(t.tags[i])!==-1){tagHit=true;break;} }
    }
    var carHit=!!((m.car||m.id==='m_car') && t.carId);
    var hasPlat=!!(rules.platformIds&&rules.platformIds.length);
    var hasTags=!!(rules.tags&&rules.tags.length);
    if(!hasPlat&&!hasTags) return catHit||carHit;
    if(m.ruleMode==='all'){
      if(!catHit&&!carHit) return false;
      if(hasPlat&&!platHit) return false;
      if(hasTags&&!tagHit) return false;
      return true;
    }
    return catHit||carHit||platHit||tagHit;
  }

  function rangeOf(range,customFrom,customTo){
    var now=new Date(),y=now.getFullYear(),m=now.getMonth();
    switch(range){
      case 'month':return [ymd(new Date(y,m,1)),ymd(new Date(y,m+1,0))];
      case 'lastMonth':return [ymd(new Date(y,m-1,1)),ymd(new Date(y,m,0))];
      case '3m':return [ymd(new Date(y,m-2,1)),ymd(new Date(y,m+1,0))];
      case 'year':return [ymd(new Date(y,0,1)),ymd(new Date(y,11,31))];
      case 'all':return ['0000-01-01','9999-12-31'];
      case 'custom':return [customFrom||ymd(new Date(y,m,1)),customTo||ymd(new Date(y,m+1,0))];
      default:return [ymd(new Date(y,m,1)),ymd(new Date(y,m+1,0))];
    }
  }

  function fitCanvas(cv,h){var parent=cv.parentElement;if(!parent)return null;var w=Math.round(parent.clientWidth-16);if(w<=0)return null;if(cv.width!==w)cv.width=w;if(cv.height!==h)cv.height=h;cv.style.height=h+'px';return {w:w,h:h};}
  function drawDonut(cv,items){
    if(!cv)return;var h=parseInt(cv.dataset.h||'200',10),dim=fitCanvas(cv,h);if(!dim)return;
    var W=dim.w,H=dim.h,ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
    var total=items.reduce(function(s,i){return s+i.value;},0),cx=W/2,cy=H/2,R=Math.min(W,H)/2-6,r=R*0.56,B=Math.max(3,Math.round(R/40));

    var acc=0,angles=items.map(function(i){var a=i.value/total*Math.PI*2,s=acc;acc+=a;return [s,s+a];});

  }
  function drawTrend(cv,series){
    if(!cv)return;var h=parseInt(cv.dataset.h||'180',10),dim=fitCanvas(cv,h);if(!dim)return;
    var W=dim.w,H=dim.h,ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
    var padL=6,padR=6,padT=12,padB=26,cw=W-padL-padR,ch=H-padT-padB,maxV=1;

    var n=series.length;if(n===0)return;var step=cw/n,bw=Math.max(3,Math.min(14,Math.floor(step*0.3))),labelEvery=Math.max(1,Math.ceil(n/Math.max(3,Math.floor(cw/46))));
    series.forEach(function(s,i){var cxx=padL+step*i+step/2,ih=Math.round((s.income||0)/maxV*ch),eh=Math.round(Math.max(0,s.expense||0)/maxV*ch);if(ih>0){ctx.fillStyle='#12b886';ctx.fillRect(Math.round(cxx-bw-1),Math.round(padT+ch-ih),bw,ih);}if(eh>0){ctx.fillStyle='#ff5c52';ctx.fillRect(Math.round(cxx+1),Math.round(padT+ch-eh),bw,eh);}if(i%labelEvery===0){ctx.fillStyle='rgba(22,22,31,.55)';ctx.font='10px '+getComputedStyle(document.body).fontFamily;var tw=ctx.measureText(s.label).width;ctx.fillText(s.label,Math.round(cxx-tw/2),H-8);}});

  function drawHeat(cv,days){
    if(!cv)return;var h=parseInt(cv.dataset.h||'130',10),dim=fitCanvas(cv,h);if(!dim)return;
    var W=dim.w,H=dim.h,ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);if(!days.length)return;
    var maxV=0;days.forEach(function(d){maxV=Math.max(maxV,d.amount);});if(maxV<=0)maxV=1;
    var cols=7,gap=3,cell=Math.max(8,Math.floor((W-4-gap*(cols-1))/cols));cell=Math.min(cell,22);
    var gridW=cell*cols+gap*(cols-1),startX=Math.round((W-gridW)/2),startY=6;
    var first=new Date(days[0].date+'T00:00:00'),offset=(first.getDay()+6)%7;
    days.forEach(function(d,i){var idx=i+offset,col=idx%7,row=Math.floor(idx/7),x=startX+col*(cell+gap),y=startY+row*(cell+gap);if(y+cell>H)return;var ratio=Math.max(0,d.amount)/maxV,color;if(d.amount<=0)color='rgba(22,22,31,.06)';else{var alpha=0.18+ratio*0.82;color='rgba(255,92,82,'+alpha.toFixed(2)+')';}ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),cell,cell);});

  function buildTrend(list,from,to){
    var f=new Date(from+'T00:00:00'),t=new Date(to+'T00:00:00');
    if(isNaN(f.getTime()))f=new Date();if(isNaN(t.getTime())||to==='9999-12-31')t=new Date();
    var days=Math.round((t-f)/864e5)+1;if(days<=0)days=1;var useMonth=days>92;
    var buckets={},order=[];
    function addBucket(key,label){if(!buckets[key]){buckets[key]={label:label,income:0,expense:0};order.push(key);}}
    if(useMonth){var cur=new Date(f.getFullYear(),f.getMonth(),1);while(cur<=t){var k=cur.getFullYear()+'-'+pad2(cur.getMonth()+1);addBucket(k,(cur.getMonth()+1)+'月');cur.setMonth(cur.getMonth()+1);}}
    else{var c2=new Date(f.getTime());while(c2<=t){var k2=ymd(c2);addBucket(k2,(c2.getMonth()+1)+'/'+c2.getDate());c2.setDate(c2.getDate()+1);}}
    list.forEach(function(tx){
      var key=useMonth?tx.date.slice(0,7):tx.date;
      if(!buckets[key]){if(useMonth)addBucket(key,parseInt(tx.date.slice(5,7),10)+'月');else addBucket(key,tx.date.slice(5).replace('-','/'));}
      var v=Number(tx.amount)||0;
      if(tx.type==='income') buckets[key].income += v;
      else if(tx.type==='expense'){
        if(tx.isRefund) buckets[key].expense -= v;
        else buckets[key].expense += v;
      }
    });
    order.sort();return order.map(function(k){return buckets[k];});
  }
  function buildHeatDays(list,from,to){
    var f=new Date(from+'T00:00:00'),t=new Date(to+'T00:00:00');
    if(isNaN(f.getTime())||to==='9999-12-31'){t=new Date();f=new Date(t.getFullYear(),t.getMonth()-2,1);}
    if(isNaN(t.getTime()))t=new Date();var span=Math.round((t-f)/864e5)+1;if(span>120)f=new Date(t.getFullYear(),t.getMonth()-3,t.getDate());
    var map={};list.forEach(function(tx){
      if(tx.type!=='expense')return;
      var v=Number(tx.amount)||0;
      if(tx.isRefund) map[tx.date]=(map[tx.date]||0)-v;
      else map[tx.date]=(map[tx.date]||0)+v;
    });
    var days=[],cur=new Date(f.getTime()),off=(cur.getDay()+6)%7;cur.setDate(cur.getDate()-off);
    while(cur<=t){var key=ymd(cur);days.push({date:key,amount:Math.max(0,map[key]||0)});cur.setDate(cur.getDate()+1);}
    return days;
  }

  function getBudgetProgress(from,to,currentRange){
    var result=[];
    db.budgets.forEach(function(b){
      var spent=0,label='';
      if(b.period==='year'&&currentRange!=='year'&&currentRange!=='all'){
        var yr=rangeOf('year');
        var sub=db.txns.filter(function(t){if(t.type!=='expense'||t.date<yr[0]||t.date>yr[1])return false;if(b.scope==='category')return t.catId===b.targetId;if(b.scope==='module'){var m2=moduleById(b.targetId);return m2&&txnMatchesModule(t,m2);}return true;});
        spent=expenseStats(sub).net;
        label=(b.scope==='total'?'总预算':b.scope==='category'?catName(b.targetId):(moduleById(b.targetId)||{}).name||'?')+'（年度）';
      }else{
        var sub2=db.txns.filter(function(t){return t.type==='expense'&&t.date>=from&&t.date<=to;});
        if(b.scope==='total'){label='总预算';spent=expenseStats(sub2).net;}
        else if(b.scope==='category'){label=catName(b.targetId);spent=expenseStats(sub2.filter(function(t){return t.catId===b.targetId;})).net;}
        else if(b.scope==='module'){var m=moduleById(b.targetId);if(!m)return;label=m.name;spent=expenseStats(sub2.filter(function(t){return txnMatchesModule(t,m);})).net;}
      }
      var pct=b.amount>0?spent/b.amount*100:0;
      result.push({label:label,spent:spent,amount:b.amount,pct:pct});
    });
    return result;
  }

  function getGoalProgress(){
    var yr = rangeOf('year');
    var out = [];
    db.categories.forEach(function(c){
      var goal = Number(db.categoryGoals[c.id])||0;
      if (goal<=0 || c.type!=='income') return;
      var earned = sumBy(db.txns.filter(function(t){return t.type==='income' && t.catId===c.id && t.date>=yr[0] && t.date<=yr[1];}), 'income');
      out.push({label:c.name+' · 目标', spent:earned, amount:goal, pct:goal>0?earned/goal*100:0});
    });
    return out.sort(function(a,b){return b.pct-a.pct;});
  }

  function moduleRecordFilterState(mId) { 
    if (!moduleRecordFilters[mId]) moduleRecordFilters[mId] = { keyword: '', sortBy: 'date_desc' }; 
    return moduleRecordFilters[mId]; 
  }
  function filterModuleRecords(list, mId) {
    var st = moduleRecordFilterState(mId);
    var arr = !st.keyword ? list.slice() : list.filter(function(t){
      var k = st.keyword.toLowerCase();
      var hay = ((t.note||'')+' '+catName(t.catId)+' '+platName(t.platformId)+' '+acctName(t.accountId)+' '+(t.tags||[]).join(' ')).toLowerCase();
      return hay.indexOf(k) !== -1;
    });
    return arr.sort(function(a,b){ 
      if (st.sortBy === 'date_desc') return b.date.localeCompare(a.date) || (b.id>a.id?1:-1);
      if (st.sortBy === 'date_asc') return a.date.localeCompare(b.date) || (a.id>b.id?1:-1);
      if (st.sortBy === 'amount_desc') return (Number(b.amount)||0) - (Number(a.amount)||0);
      if (st.sortBy === 'amount_asc') return (Number(a.amount)||0) - (Number(b.amount)||0);
      return b.date.localeCompare(a.date); 
    });
  }

  function bindModuleRecordsEvents(m, list) {

        timer = setTimeout(function(){ moduleRecordFilterState(m.id).keyword = inp.value.trim(); updateModuleRecordsList(m, list); }, 200);
      });
    }
    var sel = $('mrSort_' + m.id);
    if (sel) {
      sel.addEventListener('change', function(){
        moduleRecordFilterState(m.id).sortBy = sel.value;

  function txnRowsHTML(list){
    return list.map(function(t){
      var isUncat = !t.catId || !catById(t.catId);
      var color=isUncat?'#c8ccda':catColor(t.catId),metaParts=[];
      if(t.type==='transfer')metaParts.push('转账 → '+acctName(t.transferTo));
      if(t.platformId&&platName(t.platformId))metaParts.push(platName(t.platformId));
      if(t.accountId&&acctName(t.accountId))metaParts.push(acctName(t.accountId));
      if(t.carId){var c=carById(t.carId);if(c)metaParts.push('🚗 '+c.name);}
      if(t.maintenance){var mt=maintTypeById(t.maintenance.type);metaParts.push('🔧 '+mt.name);}
      if(t.isRefund){var orig=txnById(t.refundOf);metaParts.push(orig?('退自 '+orig.date+' '+catName(orig.catId)):'原支出已删除');}
      else {var rsum=db.txns.filter(function(x){return x.isRefund && x.refundOf===t.id;}).reduce(function(s,x){return s+(Number(x.amount)||0);},0);if(rsum>0)metaParts.push('已退 '+money(rsum));}
      if(t.note)metaParts.push(t.note);
      var tags=(t.tags||[]).map(function(x){return '<span class="mini-tag">'+esc(x)+'</span>';}).join('');
      var amtClass='expense',amtSign='−';
      if(t.type==='income'){amtClass='income';amtSign='+';}
      else if(t.type==='transfer'){amtClass='';amtSign='';}
      else if(t.isRefund){amtClass='refund';amtSign='−';}
      var tagPrefix = t.isRefund ? '<span class="refund-tag">退</span>' : '';
      var nameTxt = t.type==='transfer'?'转账':(isUncat?'待整理':catName(t.catId));
      var iconTxt = t.type==='transfer'?'转':(t.isRefund?'退':(isUncat?'📥':catName(t.catId).slice(0,1)));
      return '<button class="txn'+(t.isRefund?' refund':'')+'" data-txn="'+t.id+'" style="--accent:'+color+'"><span class="txn-icon" style="background:'+(t.isRefund?'#12b886':color)+'">'+esc(iconTxt)+'</span><span class="txn-body"><span class="txn-name">'+tagPrefix+esc(nameTxt)+' · '+esc(t.date)+'</span><span class="txn-meta">'+esc(metaParts.join(' · ')||'无备注')+'</span>'+(tags?'<span class="txn-tags">'+tags+'</span>':'')+'</span><span class="txn-amt '+amtClass+'">'+amtSign+money(t.amount)+'</span></button>';
    }).join('');
  }

  function fuelSegments(carId){
    var list=db.txns.filter(function(t){return t.carId===carId&&t.refuel&&t.type==='expense'&&!t.isRefund;}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'')||(a.refuel.mileage-b.refuel.mileage);});
    var anchors=[];list.forEach(function(t,i){if(t.refuel.isFull||t.refuel.lowLight)anchors.push(i);});
    var segs=[];
    for(var k=1;k<anchors.length;k++){
      var iPrev=anchors[k-1],iCur=anchors[k],prev=list[iPrev],cur=list[iCur];
      var dist=cur.refuel.mileage-prev.refuel.mileage;if(!(dist>0))continue;
      var liters=0,cost=0;for(var j=iPrev+1;j<=iCur;j++){liters+=Number(list[j].refuel.liters)||0;cost+=Number(list[j].amount)||0;}
      if(liters<=0)continue;
      segs.push({from:prev.date,to:cur.date,dist:dist,liters:liters,cost:cost,l100:liters/dist*100,costPerKm:cost/dist,anchorType:prev.refuel.isFull&&cur.refuel.isFull?'full':'light'});
    }
    return {list:list,segs:segs};
  }

    html+='<div class="card"><div class="card-head"><div class="card-title">费用趋势（按月）</div><div class="card-sub">COST TREND</div></div><div class="chart-box" style="margin-bottom:4px"><canvas id="cvCarCostTrend" data-h="190"></canvas></div><div class="chart-legend" id="carCostLegend"></div></div>';

    else{var maxType=catArr[0].value||1;html+=catArr.map(function(p){var w=Math.max(2,Math.round(p.value/maxType*100));return '<div class="hbar-row"><span class="hbar-label">'+esc(p.name)+'</span><div class="hbar-track"><div class="hbar-fill" style="width:'+w+'%;background:'+p.color+'"></div></div><span class="hbar-val">'+moneyShort(p.value)+'</span></div>';}).join('');}

    if(segs.length){html+='<div class="card"><div class="card-head"><div class="card-title">油耗区间明细</div><div class="card-sub">SEGMENTS</div></div>';segs.slice().reverse().slice(0,20).forEach(function(s){html+='<div class="set-row"><div style="flex:1;min-width:0"><div class="set-name" style="font-size:12px">'+esc(s.from)+' → '+esc(s.to)+'</div><div class="txn-meta">'+s.dist.toFixed(1)+' km · '+s.liters.toFixed(2)+' L'+(s.anchorType==='light'?' · 亮灯':'')+'</div></div><div style="text-align:right"><div style="font-size:13px;font-weight:800;color:#8f6900">'+s.l100.toFixed(2)+'</div><div class="txn-meta">¥'+s.costPerKm.toFixed(3)+'/km</div></div></div>';});html+='</div>';}
    host.innerHTML=html;

  function drawCarCostTrend(cv,list,catArr){
    if(!cv)return;var h=parseInt(cv.dataset.h||'190',10),dim=fitCanvas(cv,h);if(!dim)return;
    var W=dim.w,H=dim.h,ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
    if(!list.length){ctx.fillStyle='rgba(22,22,31,.35)';ctx.font='12px '+getComputedStyle(document.body).fontFamily;ctx.fillText('暂无费用数据',12,H/2);return;}
    var byMonth={},order=[];
    list.forEach(function(t){var k=t.date.slice(0,7);if(!byMonth[k]){byMonth[k]={total:0,byCat:{}};order.push(k);}var v=Number(t.amount)||0;var c=t.catId||'none';if(t.isRefund){byMonth[k].total-=v;byMonth[k].byCat[c]=(byMonth[k].byCat[c]||0)-v;}else{byMonth[k].total+=v;byMonth[k].byCat[c]=(byMonth[k].byCat[c]||0)+v;}});
    order.sort();var maxV=1;order.forEach(function(k){maxV=Math.max(maxV,byMonth[k].total);});
    var padL=8,padR=8,padT=12,padB=30,cw=W-padL-padR,ch=H-padT-padB;
    ctx.fillStyle='rgba(22,22,31,.06)';for(var g=0;g<=4;g++)ctx.fillRect(padL,Math.round(padT+ch-ch*g/4),cw,1);
    var n=order.length,step=cw/Math.max(n,1),bw=Math.max(4,Math.min(18,Math.floor(step*0.55)));
    var colors={};catArr.forEach(function(t){colors[t.id]=t.color;});
    order.forEach(function(k,i){var x=padL+step*i+step/2,yBottom=padT+ch;Object.keys(byMonth[k].byCat).forEach(function(c){var v=byMonth[k].byCat[c];if(v<=0)return;var hh=Math.round(v/maxV*ch);ctx.fillStyle=colors[c]||catColor(c)||'#94d82d';ctx.fillRect(Math.round(x-bw/2),yBottom-hh,bw,hh);yBottom-=hh;});if(i%Math.max(1,Math.ceil(n/Math.max(3,Math.floor(cw/50))))===0){ctx.fillStyle='rgba(22,22,31,.55)';ctx.font='10px '+getComputedStyle(document.body).fontFamily;var label=k.slice(5)+'月';var tw=ctx.measureText(label).width;ctx.fillText(label,Math.round(x-tw/2),H-8);}});
    var legend=$('carCostLegend');if(legend)legend.innerHTML=catArr.slice(0,8).map(function(t){return '<span class="legend-item"><span class="legend-dot" style="background:'+t.color+'"></span>'+esc(t.name)+'</span>';}).join('');
  }
  function drawFuelTrend(cv,segs){
    if(!cv)return;var h=parseInt(cv.dataset.h||'170',10),dim=fitCanvas(cv,h);if(!dim)return;
    var W=dim.w,H=dim.h,ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
    if(segs.length<2){ctx.fillStyle='rgba(22,22,31,.35)';ctx.font='12px '+getComputedStyle(document.body).fontFamily;ctx.fillText('至少需要 2 个锚点区间才能绘制趋势',12,H/2);return;}
    var padL=10,padR=10,padT=14,padB=24,cw=W-padL-padR,ch=H-padT-padB;
    var vals=segs.map(function(s){return s.l100;}),maxV=Math.max.apply(null,vals),minV=Math.min.apply(null,vals),span=maxV-minV||1;
    maxV=maxV+span*0.15;minV=Math.max(0,minV-span*0.15);span=maxV-minV||1;
    ctx.fillStyle='rgba(22,22,31,.06)';for(var g=0;g<=4;g++)ctx.fillRect(padL,Math.round(padT+ch-ch*g/4),cw,1);
    var n=segs.length,step=n>1?cw/(n-1):cw,pts=segs.map(function(s,i){return {x:padL+step*i,y:padT+ch-(s.l100-minV)/span*ch};});
    ctx.fillStyle='#ffc107';for(var i=0;i<pts.length-1;i++){var p1=pts[i],p2=pts[i+1],steps=Math.max(Math.abs(p2.x-p1.x),Math.abs(p2.y-p1.y));for(var s=0;s<=steps;s+=2){var tt=steps===0?0:s/steps,xx=Math.round(p1.x+(p2.x-p1.x)*tt),yy=Math.round(p1.y+(p2.y-p1.y)*tt);ctx.fillRect(xx-1,yy-1,3,3);}}
    pts.forEach(function(p){ctx.fillStyle='#8f6900';ctx.fillRect(Math.round(p.x)-2,Math.round(p.y)-2,5,5);ctx.fillStyle='#fff6d6';ctx.fillRect(Math.round(p.x)-1,Math.round(p.y)-1,3,3);});
    ctx.fillStyle='rgba(22,22,31,.55)';ctx.font='10px '+getComputedStyle(document.body).fontFamily;var every=Math.max(1,Math.ceil(n/Math.max(2,Math.floor(cw/60))));segs.forEach(function(s,i){if(i%every!==0)return;var label=s.to.slice(5);var tw=ctx.measureText(label).width;ctx.fillText(label,Math.round(pts[i].x-tw/2),H-7);});
  }

  var maintFilter = { range: 'month', customFrom: '', customTo: '' };
  function renderMaintPage() {

        '<div class="field"><label>确认新密码</label><div class="inp-wrap"><input class="inp" id="newMasterPwd2" type="password" placeholder="再输一次"><button class="inp-eye" data-eye="newMasterPwd2">'+eyeSVG+'</button></div></div>';
    } else {
      html += '<div class="tip" style="margin-bottom:8px;line-height:1.6">请输入你的加密密码。忘记密码将无法恢复云端数据！</div>' +
        '<div class="field"><label>加密密码</label><div class="inp-wrap"><input class="inp" id="masterPwdInp" type="password" placeholder="输入加密密码"><button class="inp-eye" data-eye="masterPwdInp">'+eyeSVG+'</button></div></div>';
    }
    
    html += '</div><div class="win-foot"><button class="btn block" id="masterPwdBtn">' + (isChangeMode?'确认修改':'解锁') + '</button></div></div>';
    openLayer(html);

    $('layer').querySelectorAll('[data-eye]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var input = $(btn.dataset.eye);
        if(!input) return;
        if(input.type==='password'){ input.type='text'; btn.classList.add('on'); btn.innerHTML=eyeOffSVG; }
        else { input.type='password'; btn.classList.remove('on'); btn.innerHTML=eyeSVG; }
      });
    });

    if (isChangeMode) {
      $('oldMasterPwd').focus();
      $('masterPwdBtn').addEventListener('click', async function() {
        var oldP = $('oldMasterPwd').value;
        var newP1 = $('newMasterPwd1').value;
        var newP2 = $('newMasterPwd2').value;
        if (!oldP) { toast('请输入当前加密密码'); return; }
        if (!newP1 || newP1.length < 6) { toast('新密码至少 6 位'); return; }
        if (newP1 !== newP2) { toast('两次输入的新密码不一致'); return; }
        
        var btn = this; btn.disabled = true; btn.textContent = '处理中…';
        try {
          var j = await ghGetRaw();
          if (j && j.content) {
            var raw = b64Decode(j.content);
            if (raw.indexOf('"v":') !== -1) {
              await decryptString(raw, oldP);
            }
          }
          ENC.setPwd(newP1);
          await pushCloud(false);
          closeLayer();
          toast('加密密码已更新，云端数据已重新同步');
          if (onSuccess) onSuccess();
        } catch(e) {
          toast('旧密码验证失败或网络错误：' + e.message);

          btn.disabled = false; btn.textContent = '确认修改';
        }
      });
    } else {
      $('masterPwdInp').focus();
      $('masterPwdBtn').addEventListener('click', function() {
        var p = $('masterPwdInp').value;
        if (!p) { toast('请输入加密密码'); return; }
        ENC.setPwd(p);
        closeLayer();
        if (onSuccess) onSuccess();
      });
    }
  }

  function categoryOptionsFor(type, selected, ctxModuleId, mode) {
    var all = db.categories.filter(function(c){
      if (c.type !== type) return false;
      if (mode === 'car_expense' && c.id === 'cc_car_fuel') return false;
      return true;
    });
    var groups = {};
    all.forEach(function(c){
      if (ctxModuleId !== null && ctxModuleId !== undefined) {
        if ((c.moduleId||'') !== ctxModuleId && (c.moduleId||'') !== '') return;
      }
      var key = c.moduleId || '_general';
      if (!groups[key]) groups[key] = [];
      groups[key].push(c);
    });
    var html = '';
    Object.keys(groups).forEach(function(k){
      var label = k === '_general' ? '通用' : (moduleById(k)||{}).name || k;

        html += groups[k].map(function(c){return '<option value="'+c.id+'"'+(c.id===selected?' selected':'')+'>'+esc(c.name)+'</option>';}).join('');

      }
    });
    return html;

  function smartParseLine(line) {
    let text = line.trim();
    if (!text) return null;
    let date = today();
    let amount = 0;
    let type = 'expense';
    let note = '';

    // 1. 提取日期
    let dateRegex = /(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/;
    let dMatch = text.match(dateRegex);
    if (dMatch) {
        date = dMatch[1] + '-' + pad2(dMatch[2]) + '-' + pad2(dMatch[3]);
        text = text.replace(dMatch[0], ' ');
    } else {
        let dateRegex2 = /(?:^|\s)(\d{1,2})[-/.](\d{1,2})(?:\s|$)/;
        let dMatch2 = text.match(dateRegex2);
        if (dMatch2) {
            date = new Date().getFullYear() + '-' + pad2(dMatch2[1]) + '-' + pad2(dMatch2[2]);
            text = text.replace(dMatch2[0], ' ');
        }
    }

    // 2. 提取金额（获取最显著的数字）
    let nums = [...text.matchAll(/([+-]?\d+(?:\.\d{1,2})?)/g)];
    if (nums.length > 0) {
        let best = nums.reduce((prev, curr) => {
            return parseFloat(curr[1]) > parseFloat(prev[1]) ? curr : prev;
        });
        amount = Math.abs(parseFloat(best[1]));
        if (best[1].startsWith('-') || /支出|消费|付款|花/.test(text)) type = 'expense';
        else if (best[1].startsWith('+') || /收入|工资|退款|收/.test(text)) type = 'income';
        text = text.replace(best[1], ' ');
    }

    // 3. 清理备注
    note = text.replace(/[¥$,，、]/g, ' ').replace(/\s+/g, ' ').trim();
    return { date, amount, type, note };
  }

  function openImportDialog() {
    var html = '<div class="pxwin" role="dialog" aria-modal="true">' +
      '<div class="win-bar"><div><div class="win-title">SMART IMPORT</div><div class="win-sub">智能解析与批量导入</div></div><button class="win-x" data-act="close">'+xSVG+'</button></div>' +
      '<div class="win-scroll">' +
      '<div class="tip" style="margin-bottom:8px;line-height:1.6;">' +
      '支持粘贴标准 CSV/TSV，或者无表头的简单文本。<br>' +
      '<b>示例（无表头）：</b><br>2023-10-01 超市购物 88.5元<br>2023/10/02, 工资 +8000<br>' +
      '<b>示例（有表头）：</b><br>日期,金额,类型,备注<br>2023-10-01,88.5,支出,超市购物' +
      '</div>' +
      '<div class="row-flex"><button class="btn sm" id="btnChooseFile">选择文件</button><input type="file" id="csvFile" accept=".csv,.txt" hidden></div>' +
      '<div class="field"><label>粘贴数据</label><textarea class="inp" id="csvRaw" rows="6" placeholder="在此粘贴账单记录…"></textarea></div>' +
      '<button class="btn block" id="btnParse">开始解析</button>' +
      '<div id="importPreview" style="margin-top:12px;display:none;">' +
      '<div class="hint-line" id="importSummary"></div>' +
      '<div class="csv-table-wrap"><table class="csv-table" id="importTable"></table></div>' +
      '</div>' +
      '</div>' +
      '<div class="win-foot" id="importFoot" style="display:none;">' +
      '<button class="btn block" id="btnConfirmImport">确认导入</button>' +
      '</div></div>';
    openLayer(html);

    var parsedTxns = [];

    $('btnChooseFile').addEventListener('click', function(){ $('csvFile').click(); });
    $('csvFile').addEventListener('change', function(e){
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        $('csvRaw').value = ev.target.result;
        toast('文件已读取');
      };
      reader.readAsText(file);
    });

    $('btnParse').addEventListener('click', function(){
      var raw = $('csvRaw').value.trim();
      if (!raw) { toast('请先输入或选择数据'); return; }
      
      $('importPreview').style.display = 'none';
      $('importFoot').style.display = 'none';
      $('importTable').innerHTML = '';
      parsedTxns = [];
      
      var lines = raw.split(/\r?\n/).filter(function(l){ return l.trim().length > 0; });
      if (!lines.length) { toast('没有有效数据'); return; }
      
      var isHeader = /日期|时间|金额|类型|备注|商品|交易/.test(lines[0]) && !/^\d/.test(lines[0].trim());
      
      if (isHeader) {
        var delimiter = lines[0].indexOf('\t') !== -1 ? '\t' : (lines[0].indexOf(',') !== -1 ? ',' : ' ');
        var headers = lines[0].split(delimiter).map(function(h){ return h.trim().replace(/^["']|["']$/g, ''); });
        
        for (var i = 1; i < lines.length; i++) {
          var cols = lines[i].split(delimiter).map(function(c){ return c.trim().replace(/^["']|["']$/g, ''); });
          if (cols.length < 2) continue;

          var row = {};
          headers.forEach(function(h, idx){ row[h] = cols[idx]; });

          var date = '', amount = 0, type = 'expense', catId = '', note = '';
          
          var dateKey = Object.keys(row).find(function(k){ return /日期|时间|交易时间/.test(k); });
          if (dateKey && row[dateKey]) {
            var dMatch = row[dateKey].match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
            if (dMatch) date = dMatch[1] + '-' + pad2(dMatch[2]) + '-' + pad2(dMatch[3]);
          }
          if (!date) date = today();

          var amtKey = Object.keys(row).find(function(k){ return /金额|价格|支出|收入/.test(k); });
          if (amtKey && row[amtKey]) {
            amount = Math.abs(parseFloat(row[amtKey].replace(/[^\d.-]/g, ''))) || 0;
          }
          if (amount < 0) continue;

          var typeKey = Object.keys(row).find(function(k){ return /类型|收支/.test(k); });
          if (typeKey && /收入|收/.test(row[typeKey])) type = 'income';
          if (amtKey && /收入/.test(amtKey)) type = 'income';

          var noteKey = Object.keys(row).find(function(k){ return /备注|商品|说明|摘要|交易对方/.test(k); });
          if (noteKey && row[noteKey]) note = row[noteKey];

          var searchStr = (note + ' ' + Object.values(row).join(' ')).toLowerCase();
          var bestCat = db.categories.find(function(c){
            if (c.type !== type) return false;
            return searchStr.indexOf(c.name.toLowerCase()) !== -1;
          });
          if (bestCat) catId = bestCat.id;
          else {
            var defCats = db.categories.filter(function(c){return c.type === type;});
            catId = defCats.length ? defCats[0].id : '';
          }

          parsedTxns.push({
            id: uid('t'), type: type, amount: amount, date: date, catId: catId,
            accountId: '', platformId: '', note: note, tags: [], carId: '',
            refuel: null, isRefund: false, refundOf: '', maintenance: null
          });
        }
      } else {
        // 无表头智能解析
        lines.forEach(function(line) {
          var t = smartParseLine(line);
          if (t && t.amount >= 0) {
            var searchStr = (t.note + ' ' + line).toLowerCase();
            var bestCat = db.categories.find(function(c){
              if (c.type !== t.type) return false;
              return searchStr.indexOf(c.name.toLowerCase()) !== -1;
            });
            var catId = bestCat ? bestCat.id : '';
            
            parsedTxns.push({
              id: uid('t'), type: t.type, amount: t.amount, date: t.date, catId: catId,
              accountId: '', platformId: '', note: t.note, tags: [], carId: '',
              refuel: null, isRefund: false, refundOf: '', maintenance: null
            });
          }
        });
      }

      if (!parsedTxns.length) { toast('未能解析出有效数据，请检查格式'); return; }

      var tbody = parsedTxns.map(function(t){
        return '<tr>' +
          '<td>' + t.date + '</td>' +
          '<td>' + (t.type === 'expense' ? '支出' : '收入') + '</td>' +
          '<td>' + money(t.amount) + '</td>' +
          '<td class="'+(t.catId ? 'good' : 'bad')+'">' + catName(t.catId) + '</td>' +
          '<td>' + (t.refuel ? '加油(已关联)' : '') + '</td>' +
          '<td>' + esc(t.note) + '</td>' +
        '</tr>';
      }).join('');

      $('importTable').innerHTML = '<thead><tr><th>日期</th><th>类型</th><th>金额</th><th>匹配分类</th><th>附加</th><th>备注</th></tr></thead><tbody>' + tbody + '</tbody>';
      $('importSummary').innerHTML = '共解析出 <b>' + parsedTxns.length + '</b> 条记录，请确认无误后导入。';
      $('importPreview').style.display = 'block';
      $('importFoot').style.display = 'block';
    });

    $('btnConfirmImport').addEventListener('click', function(){
      if (!parsedTxns.length) return;
      parsedTxns.forEach(function(t){ db.txns.push(t); });
      persist(); renderShell();
      closeLayer();
      toast('成功导入 ' + parsedTxns.length + ' 条记录');
      refreshAfterDataChange();
    });
  }

  function renderSetBudgets(){
    var budgetRows = db.budgets.map(function(b){
      var target = b.scope==='total'?'总预算':b.scope==='category'?catName(b.targetId):(moduleById(b.targetId)||{}).name||'未知';

    }).join('') || '<div class="tip" style="padding:6px 2px">还没有预算，点击下方按钮添加。</div>';

    var yr = rangeOf('year');
    var goalRows = db.categories.filter(function(c){return c.type==='income' && Number(db.categoryGoals[c.id])>0;}).map(function(c){
      var goal = Number(db.categoryGoals[c.id]);
      var earned = sumBy(db.txns.filter(function(t){return t.type==='income' && t.catId===c.id && t.date>=yr[0] && t.date<=yr[1];}), 'income');

  function openBudgetEditor(id) {
    var b = id ? db.budgets.filter(function(x){return x.id===id;})[0] : null;

      '<div class="tx-field" id="bgTargetWrap"><label>目标</label><select class="inp" id="bgTarget"></select></div>'+
      '<div class="tx-grid2"><div class="tx-field"><label>金额</label><input class="inp" id="bgAmount" type="number" step="0.01" placeholder="0.00"></div><div class="tx-field"><label>周期</label><select class="inp" id="bgPeriod"><option value="month">每月</option><option value="year">每年</option></select></div></div>'+

    var scopeSel = $('bgScope'); scopeSel.value = cur.scope;
    function refreshTargets() {
      var s = scopeSel.value;
      var t = $('bgTarget');
      if (s === 'total') { $('bgTargetWrap').hidden = true; t.innerHTML='<option value="">—</option>'; }
      else if (s === 'category') { $('bgTargetWrap').hidden = false; t.innerHTML = db.categories.filter(function(c){return c.type==='expense';}).map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join(''); t.value = cur.targetId || (t.options[0]&&t.options[0].value) || ''; }
      else { $('bgTargetWrap').hidden = false; t.innerHTML = sortedModules().map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+'</option>';}).join(''); t.value = cur.targetId || (t.options[0]&&t.options[0].value) || ''; }
    }
    refreshTargets();
    scopeSel.addEventListener('change', refreshTargets);
    $('bgAmount').value = cur.amount || '';
    $('bgPeriod').value = cur.period || 'month';
    if (!isNew) $('bgDel').addEventListener('click', function(){
      db.budgets = db.budgets.filter(function(x){return x.id!==id;}); persist(); closeLayer(); renderSettings(); toast('预算已删除');
    });
    $('bgSave').addEventListener('click', function(){
      var amount = parseFloat($('bgAmount').value);
      if (!(amount>0)) { toast('请输入预算金额'); return; }
      var scope = scopeSel.value;
      var target = scope==='total' ? '' : $('bgTarget').value;
      if (scope!=='total' && !target) { toast('请选择目标'); return; }
      var period = $('bgPeriod').value;
      if (isNew) db.budgets.push({id:uid('bg'),scope:scope,targetId:target,period:period,amount:amount});
      else { cur.scope=scope; cur.targetId=target; cur.period=period; cur.amount=amount; }
      persist(); closeLayer(); renderSettings(); toast(isNew?'预算已添加':'预算已更新');
    });
  }

            if(!confirm('该分类下还有 '+used+' 件好物，且没有其他分类可转移。确认直接删除？（好物分类将变为未分类）')) return;
            db.itemCategories=db.itemCategories.filter(function(c){return c.id!==id;});
            db.items.forEach(function(it){if(it.catId===id)it.catId='';});
            persist();renderSettings();toast('分类已删除');
          } else {
            askTransfer('删除好物分类', '该分类下还有 <b>'+used+'</b> 件好物。您可以将它们转移到其他分类，或直接删除变为未分类。<br><br>确认删除吗？', opts,
              function(targetId){
                db.itemCategories=db.itemCategories.filter(function(c){return c.id!==id;});
                db.items.forEach(function(it){if(it.catId===id)it.catId=targetId;});
                persist();renderSettings();toast('分类已删除并转移好物');
              },
              function(){
                db.itemCategories=db.itemCategories.filter(function(c){return c.id!==id;});
                db.items.forEach(function(it){if(it.catId===id)it.catId='';});
                persist();renderSettings();toast('分类已删除');
              }
            );
          }
        } else {
          if(!confirm('确定删除该分类？')) return;
          db.itemCategories=db.itemCategories.filter(function(c){return c.id!==id;});
          persist();renderSettings();toast('已删除');
        }
      });});
    }
    if(pane==='cloud'){
      $('btnSaveGh').addEventListener('click',function(){var t=$('ghToken').value.trim(),o=$('ghOwner').value.trim(),r=$('ghRepo').value.trim();if(!t||!o||!r){toast('Token、用户名、仓库名都要填');return;}GH.save(t,o,r,$('ghBranch').value,$('ghPath').value);renderSettings();toast('配置已保存');pushCloud(true).then(function(ok){if(ok)toast('连接成功');});});
      $('btnTestGh').addEventListener('click',function(){toast('正在测试…');fetch('https://api.github.com/zen',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){toast('网络通畅：'+t.slice(0,30));}).catch(function(){toast('网络不通');});});
      
      var btnEnc = $('btnToggleEnc');
      if (btnEnc) btnEnc.addEventListener('click', function(){
        var isEnc = ENC.isEnabled();
        if (isEnc) {
          openMasterPwdDialog('关闭数据加密', function(){
            ENC.setEnabled(false);
            ENC.setPwd('');
            pushCloud(false).then(function(){ renderSettings(); toast('已关闭云端加密'); });
          });
        } else {
          openLayer('<div class="pxwin compact dlg" role="dialog"><div class="win-bar"><div><div class="win-title">开启数据加密</div><div class="win-sub">请设置独立加密密码</div></div><button class="win-x" data-act="close">'+xSVG+'</button></div><div class="win-scroll"><div class="tip" style="color:#c92a2a;margin-bottom:8px;">请牢记加密密码！一旦遗忘，云端数据将永久无法恢复。</div><div class="field"><label>加密密码</label><div class="inp-wrap"><input class="inp" id="newEncPwd1" type="password" placeholder="建议 8 位以上"><button class="inp-eye" data-eye="newEncPwd1">'+eyeSVG+'</button></div></div><div class="field"><label>确认密码</label><div class="inp-wrap"><input class="inp" id="newEncPwd2" type="password" placeholder="再输一次"><button class="inp-eye" data-eye="newEncPwd2">'+eyeSVG+'</button></div></div></div><div class="win-foot"><button class="btn block" id="doEnableEnc">确认开启</button></div></div>');
          
          $('layer').querySelectorAll('[data-eye]').forEach(function(btn){
            btn.addEventListener('click',function(){
              var input = $(btn.dataset.eye);
              if(!input) return;
              if(input.type==='password'){ input.type='text'; btn.classList.add('on'); btn.innerHTML=eyeOffSVG; }
              else { input.type='password'; btn.classList.remove('on'); btn.innerHTML=eyeSVG; }
            });
          });

          $('doEnableEnc').addEventListener('click', function(){
            var p1 = $('newEncPwd1').value;
            var p2 = $('newEncPwd2').value;
            if (!p1 || p1.length < 6) { toast('加密密码至少 6 位'); return; }
            if (p1 !== p2) { toast('两次输入的密码不一致'); return; }
            ENC.setPwd(p1);
            ENC.setEnabled(true);
            closeLayer();
            pushCloud(false).then(function(){ renderSettings(); toast('加密已开启，数据已重新同步'); });
          });
        }
      });

      var btnChange = $('btnChangeEncPwd');
      if (btnChange) btnChange.addEventListener('click', function(){
        openMasterPwdDialog('修改加密密码', null, true);
      });
    }
    if(pane==='auth'){
      $('setMain').querySelectorAll('[data-eye]').forEach(function(btn){btn.addEventListener('click',function(){var input=$(btn.dataset.eye);if(!input)return;if(input.type==='password'){input.type='text';btn.classList.add('on');btn.innerHTML=eyeOffSVG;}else{input.type='password';btn.classList.remove('on');btn.innerHTML=eyeSVG;}});});
      var btn=$('btnSaveAuth');
      if(btn)btn.addEventListener('click',async function(){
        var oldP=($('auOldPass').value||''),newU=($('auNewUser').value||'').trim(),newP=($('auNewPass').value||''),newP2=($('auNewPass2').value||'');
        if(!oldP){toast('请输入当前密码');return;}
        if(!newU){toast('请输入新账号');return;}
        if(!newP){toast('请输入新密码');return;}
        if(newP.length<6){toast('新密码至少 6 位');return;}
        if(newP!==newP2){toast('两次输入的新密码不一致');return;}
        if(!hasCryptoSubtle()){toast('当前环境不支持加密，请通过 HTTPS 访问');return;}
        if(btn.disabled)return;
        btn.disabled=true;btn.textContent='验证中…';
        try{
          var ok=false;
          try{ok=await verifyPassword(oldP,db.auth);}catch(e){toast(e.message||'验证失败');return;}
          if(!ok){toast('当前密码不正确');return;}
          var salt=randomSaltHex();
          var hash=await pbkdf2Hash(newP,salt,PBKDF2_ITERS);
          db.auth={user:newU,salt:salt,hash:hash,iters:PBKDF2_ITERS,customized:true};
          persist();toast('账号密码已更新');renderSettings();
        }catch(err){toast('更新失败：'+(err.message||err));}finally{btn.disabled=false;btn.textContent='更新账号密码';}
      });
    }
    if(pane==='data'){
      $('btnExport').addEventListener('click',function(){var blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='pixel-ledger-'+today()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},1000);toast('已导出');});
      $('btnImport').addEventListener('click',function(){$('fileImport').click();});
      $('fileImport').addEventListener('change',function(e){var file=e.target.files&&e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result);if(!data||!Array.isArray(data.txns)||!Array.isArray(data.categories))throw new Error('格式不正确');if(!confirm('导入将覆盖当前全部数据，确定？'))return;db=data;ensureDbShape();persist();renderShell();showPage(page);toast('导入成功');}catch(err){toast('导入失败：'+err.message);}};reader.readAsText(file);e.target.value='';});
      $('btnClear').addEventListener('click',function(){if(!confirm('确定清空全部交易记录？不可撤销。'))return;db.txns=[];persist();renderShell();showPage(page);toast('已清空');});
    }
    if(pane==='general'){
      var ms=$('setMonthStart');if(ms){ms.addEventListener('change',function(){try{localStorage.setItem('px_month_start',ms.value);}catch(e){}toast('每月起始日已更新');});}
    }
  }

  function openModuleEditor(id){
    var m=id?moduleById(id):null;var isNew=!m;
    if(isNew)m={id:uid('m'),name:'',icon:'📁',color:COLORS[db.modules.length%COLORS.length],order:(db.modules.reduce(function(s,x){return Math.max(s,x.order||0);},0)+1),dimensionField:'category',ruleMode:'any',rules:{types:['expense'],catIds:[],platformIds:[],tags:[],cars:false}};
    var r=m.rules,typesAll=['expense','income','transfer'],typeLabels={expense:'支出',income:'收入',transfer:'转账'};
    var iconChoices=['📁','🍜','🏠','🎮','🛒','🚗','💰','✈️','🎁','💊','📚','👕','🐱','💻','🏋️','🎵','📱','🍺','☕','🎬'];
    openLayer('<div class="pxwin" role="dialog" aria-modal="true"><div class="win-bar"><div><div class="win-title">'+(isNew?'NEW MODULE':'EDIT MODULE')+'</div><div class="win-sub">页面模块</div></div><button class="win-x" data-act="close">'+xSVG+'</button></div><div class="win-scroll"><div class="field"><label>模块名称</label><input class="inp" id="mdName" value="'+esc(m.name)+'" maxlength="12" placeholder="如：生活饮食"></div><div class="field"><label>图标</label><div class="multi-chips" id="mdIcons">'+iconChoices.map(function(ic){return '<button class="mchip'+(m.icon===ic?' on':'')+'" data-icon="'+ic+'">'+ic+'</button>';}).join('')+'</div></div><div class="field"><label>颜色</label><div class="color-pick" id="mdColors">'+COLORS.map(function(c){return '<button class="cpick'+(m.color===c?' on':'')+'" data-color="'+c+'" style="background:'+c+'"></button>';}).join('')+'</div></div><div class="field"><label>统计维度</label><select class="inp" id="mdDim"><option value="category"'+(m.dimensionField==='category'?' selected':'')+'>分类</option><option value="platform"'+(m.dimensionField==='platform'?' selected':'')+'>平台</option><option value="tag"'+(m.dimensionField==='tag'?' selected':'')+'>标签</option><option value="account"'+(m.dimensionField==='account'?' selected':'')+'>账户</option></select></div><div class="field"><label>收支类型</label><div class="multi-chips" id="mdTypes">'+typesAll.map(function(t){return '<button class="mchip'+(r.types.indexOf(t)!==-1?' on':'')+'" data-rtype="'+t+'">'+typeLabels[t]+'</button>';}).join('')+'</div></div><div class="field"><label>规则组合方式</label><div class="multi-chips" id="mdMode"><button class="mchip'+(m.ruleMode==='any'?' on':'')+'" data-mode="any">任一满足</button><button class="mchip'+(m.ruleMode==='all'?' on':'')+'" data-mode="all">全部满足</button></div></div><div class="field"><label>命中平台（可多选）</label><div class="multi-chips" id="mdPlats">'+db.platforms.map(function(p){return '<button class="mchip'+(r.platformIds.indexOf(p.id)!==-1?' on':'')+'" data-rplat="'+p.id+'">'+esc(p.name)+'</button>';}).join('')+'</div></div><div class="tip">规则决定交易是否出现在该模块。分类归属在「分类」面板维护。</div></div><div class="win-foot"><div class="win-actions"><button class="btn ghost" data-act="close">取消</button><button class="btn" id="mdSave">保存模块</button></div></div></div>');
    var tmp=clone(m);
    $('mdIcons').addEventListener('click',function(e){var b=e.target.closest('[data-icon]');if(!b)return;tmp.icon=b.dataset.icon;$('mdIcons').querySelectorAll('.mchip').forEach(function(x){x.classList.toggle('on',x===b);});});
    $('mdColors').addEventListener('click',function(e){var b=e.target.closest('[data-color]');if(!b)return;tmp.color=b.dataset.color;$('mdColors').querySelectorAll('.cpick').forEach(function(x){x.classList.toggle('on',x===b);});});
    $('mdDim').addEventListener('change',function(){tmp.dimensionField=$('mdDim').value;});
    $('mdTypes').addEventListener('click',function(e){var b=e.target.closest('[data-rtype]');if(!b)return;var t=b.dataset.rtype,idx=tmp.rules.types.indexOf(t);if(idx>=0){if(tmp.rules.types.length<=1){toast('至少保留一个类型');return;}tmp.rules.types.splice(idx,1);b.classList.remove('on');}else{tmp.rules.types.push(t);b.classList.add('on');}});
    $('mdMode').addEventListener('click',function(e){var b=e.target.closest('[data-mode]');if(!b)return;tmp.ruleMode=b.dataset.mode;$('mdMode').querySelectorAll('.mchip').forEach(function(x){x.classList.toggle('on',x===b);});});
    $('mdPlats').addEventListener('click',function(e){var b=e.target.closest('[data-rplat]');if(!b)return;var id2=b.dataset.rplat,idx=tmp.rules.platformIds.indexOf(id2);if(idx>=0){tmp.rules.platformIds.splice(idx,1);b.classList.remove('on');}else{tmp.rules.platformIds.push(id2);b.classList.add('on');}});
    $('mdSave').addEventListener('click',function(){var name=($('mdName').value||'').trim();if(!name){toast('请输入模块名称');return;}tmp.name=name;tmp.dimensionField=$('mdDim').value;if(isNew){tmp.order=(db.modules.reduce(function(s,x){return Math.max(s,x.order||0);},0)+1);db.modules.push(tmp);}else{var idx=db.modules.findIndex(function(x){return x.id===tmp.id;});if(idx>=0)db.modules[idx]=tmp;}persist();closeLayer();renderShell();renderSettings();toast(isNew?'模块已添加':'模块已保存');});
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-page]');
    if (b) { showPage(b.dataset.page); return; }
  });
  $('setSide').addEventListener('click', function(e){
    var b = e.target.closest('[data-setpane]'); if (!b) return;
    var k = b.dataset.setpane; if (!k) return;
    currentSetPane = k; renderSettings();
  });

  $('carSelectBtn').addEventListener('click', function(){
    if (db.cars.length <= 1) { toast('目前只有一辆车'); return; }
    var opts = db.cars.map(function(c){return '<option value="'+c.id+'"'+(c.id===currentCarId?' selected':'')+'>'+esc(c.name)+(c.plate?' · '+esc(c.plate):'')+'</option>';}).join('');
    openLayer('<div class="pxwin compact dlg" role="dialog"><div class="win-bar"><div><div class="win-title">SELECT CAR</div><div class="win-sub">切换车辆</div></div><button class="win-x" data-act="close">'+xSVG+'</button></div><div class="win-scroll"><div class="field"><label>选择车辆</label><select class="inp" id="tempCarSelect">'+opts+'</select></div></div><div class="win-foot"><button class="btn block" id="doSwitchCar">确认切换</button></div></div>');
    $('doSwitchCar').addEventListener('click', function(){
      currentCarId = $('tempCarSelect').value;
      $('carSelectBtn').textContent = carById(currentCarId).name;
      closeLayer();
      if (page === 'mod:m_car') renderCarModule(moduleById('m_car'));
      else if (page === 'maint') renderMaintPage();
    });
  });

  $('lgSubmit').addEventListener('click', doLogin);
  $('lgPass').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
  $('btnLogout').addEventListener('click',function(){authed=false;showLogin();$('lgUser').value='';$('lgPass').value='';setTimeout(function(){$('lgUser').focus();},100);});
  $('btnSync').addEventListener('click',function(){if(!GH.ready()){toast('请先在设置中配置 GitHub');currentSetPane='cloud';showPage('set');return;}pushCloud(false);});
  
  $('btnImportTxn').addEventListener('click', openImportDialog);

  $('fabAdd').addEventListener('click',function(){
    if (page === 'items') { openItemForm(null); return; }
    if (page === 'recurring') { openRecurringEditor(null); return; }
    if (page === 'maint') { openMaintForm(null); return; }
    
    var forcedType = 'expense';
    var preset = null;
    if(page.indexOf('mod:')===0){
      var m=moduleById(page.slice(4));
      if(m){
        if(m.car || m.id === 'm_car'){
          var firstCarCat=db.categories.filter(function(c){return c.car && (c.moduleId||'')==='m_car';})[0];
          preset={type:'expense',catId:firstCarCat?firstCarCat.id:'',carId:currentCarId};
        } else {
          var types = m.rules.types || ['expense'];
          forcedType = types.indexOf('income') !== -1 && types.indexOf('expense') === -1 ? 'income' : 'expense';
          var firstCat=db.categories.filter(function(c){return c.type===forcedType && (c.moduleId||'')===m.id;})[0];
          preset={type:forcedType,catId:firstCat?firstCat.id:''};
        }
      }
    }
    openTxnForm(null,preset,null,forcedType);
  });
  $('quickSearch').addEventListener('input',function(){listFilters.keyword=$('quickSearch').value.trim();renderList();});
  $('btnToggleSearch').addEventListener('click',function(){searchOpen=!searchOpen;$('searchPanel').hidden=!searchOpen;$('btnToggleSearch').textContent=searchOpen?'收起':'筛选';});
  $('btnApplyFilter').addEventListener('click',function(){listFilters.from=$('fFrom').value;listFilters.to=$('fTo').value;listFilters.type=$('fType').value;listFilters.cat=$('fCat').value;listFilters.plat=$('fPlat').value;renderList();toast('筛选已应用');});
  $('btnResetFilter').addEventListener('click',function(){listFilters={from:'',to:'',type:'all',cat:'all',plat:'all',keyword:'',sortBy:'date_desc'};$('quickSearch').value='';$('listSort').value='date_desc';renderList();toast('已重置');});
  $('listSort').addEventListener('change', function(){ listFilters.sortBy = $('listSort').value; renderList(); });
  $('btnBatchToggle').addEventListener('click',function(){batchMode=!batchMode;if(!batchMode)batchSet.clear();renderList();});
  $('txnList').addEventListener('click',function(e){if(batchMode)return;var b=e.target.closest('[data-txn]');if(b)openTxnForm(b.dataset.txn);});
  $('batchAll').addEventListener('change',function(e){var checked=e.target.checked;db.txns.filter(function(t){if(listFilters.from&&t.date<listFilters.from)return false;if(listFilters.to&&t.date>listFilters.to)return false;if(listFilters.type!=='all'&&t.type!==listFilters.type)return false;if(listFilters.cat!=='all'&&t.catId!==listFilters.cat)return false;if(listFilters.plat!=='all'&&t.platformId!==listFilters.plat)return false;return true;}).forEach(function(t){if(checked)batchSet.add(t.id);else batchSet.delete(t.id);});renderList();});
  $('btnBatchDel').addEventListener('click',function(){if(!batchSet.size){toast('先勾选记录');return;}if(!confirm('删除选中的 '+batchSet.size+' 笔记录？'))return;db.txns=db.txns.filter(function(t){return !batchSet.has(t.id);});batchSet.clear();batchMode=false;persist();renderList();toast('已批量删除');});
  $('btnBatchTag').addEventListener('click',function(){if(!batchSet.size){toast('先勾选记录');return;}var tag=prompt('给选中的 '+batchSet.size+' 笔记录添加标签');if(!tag)return;db.txns.forEach(function(t){if(batchSet.has(t.id)){t.tags=t.tags||[];if(t.tags.indexOf(tag)===-1)t.tags.push(tag);}});batchSet.clear();batchMode=false;persist();renderList();toast('已批量添加标签');});
  $('btnAddRecurring').addEventListener('click',function(){openRecurringEditor(null);});
  $('layer').addEventListener('click',function(e){if(e.target===$('layer')){closeLayer();return;}var b=e.target.closest('[data-act]');if(!b)return;var act=b.dataset.act;if(act==='close'){closeLayer();return;}if(act==='save-txn'){saveTxnForm();return;}if(act==='del-txn'){if(editingTxnId&&confirm('确定删除？'))deleteTxn(editingTxnId);return;}if(act==='del-item'){if(editingItemId&&confirm('确定删除这条好物记录？'))deleteItem(editingItemId);return;}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('layer').classList.contains('on'))closeLayer();if($('rangePop').classList.contains('on'))closeRangePop();}});
  var resizeTimer=null;window.addEventListener('resize',function(){clearTimeout(resizeTimer);resizeTimer=setTimeout(function(){if(!authed)return;if(page==='dash')renderDash();else if(page==='maint')renderMaintPage();else if(page.indexOf('mod:')===0){var m=moduleById(page.slice(4));if(m)renderModulePage(m);}},200);});

  function boot(){
    GH.load();
    var raw = null;
    try { raw = localStorage.getItem('px_ledger'); } catch(e) {}
    if (raw) {
      try { var parsed = JSON.parse(raw); if (parsed && Array.isArray(parsed.txns)) db = parsed; } catch(e) {}
    }
    ensureDbShape();
    $('loginHint').innerHTML = '正在读取云端配置…';
    
    if (GH.ready()) {
      withTimeout(ghGet(), 5000).then(function(remote){
        if (remote && Array.isArray(remote.txns)) { 
          db = remote; ensureDbShape(); saveLocal(); 
          renderLoginHint('cloud'); 
        } else {
          renderLoginHint('empty');
        }
      }).catch(function(e){
        if (e.message.indexOf('需要加密密码') !== -1) {
          window.needMasterPwd = true;
          renderLoginHint('need_pwd');
        } else {
          renderLoginHint('fail');
        }
      }).finally(function(){
        setSyncState('ok');
        setTimeout(function(){ $('lgUser').focus(); }, 120);
      });
    } else {
      renderLoginHint('nogh');
      setSyncState('idle');
      setTimeout(function(){ $('lgUser').focus(); }, 120);
    }
  }
  boot();
})();
</script>
